version: v0.3

listeners:
  - name: workshop
    address: 0.0.0.0
    port: 8898
    timeout: 600s

providers:
  models:
    - name: routine-model
      api_format: openai
      provider_model_id: gemma-4-12b
      backend_refs:
        - name: routine-backend
          endpoint: 127.0.0.1:8002
          protocol: http
          weight: 1
    - name: reasoning-model
      api_format: openai
      provider_model_id: qwen3.8-27b
      backend_refs:
        - name: reasoning-backend
          endpoint: 127.0.0.1:8001
          protocol: http
          weight: 1

routing:
  modelCards:
    - name: routine-model
      modality: text
      context_window_size: 65536
    - name: reasoning-model
      modality: text
      context_window_size: 65536
  signals:
    complexity:
      - name: request_complexity
        threshold: 0.10
        description: Separate direct requests from reasoning-heavy work.
        hard:
          candidates:
            - diagnose cascading failures in a distributed system
            - compare multiple remediation strategies and their tradeoffs
            - analyze a root cause and justify a safe rollout plan
            - investigate a complex production failure from incomplete evidence
            - solve a multi-step system design problem
        easy:
          candidates:
            - define a technical term in one sentence
            - summarize a short passage briefly
            - rewrite a sentence without analysis
  decisions:
    - name: reasoning-lane
      description: Use the stronger model for difficult work.
      priority: 200
      rules:
        operator: AND
        conditions:
          - type: complexity
            name: request_complexity:hard
      modelRefs:
        - model: reasoning-model
          use_reasoning: true
      algorithm:
        type: static
    - name: routine-lane
      description: Use the routine model for everything else.
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: routine-model
      algorithm:
        type: static

global:
  router:
    auto_model_names:
      - vllm-sr/auto
  services:
    management_api:
      bind_address: 127.0.0.1
      port: 8080
      remote_exposure: false
    router_replay:
      enabled: true
      store_backend: memory
  stores:
    response_cache:
      enabled: false
